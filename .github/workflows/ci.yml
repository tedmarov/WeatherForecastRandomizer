name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test WeatherAngularASP.Server.Tests/WeatherAngularASP.Server.Tests.csproj -p:ShouldRunNpmInstall=false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: weatherangularasp.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: weatherangularasp.client/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
